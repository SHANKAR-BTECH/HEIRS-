spring.application.name=heirs-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/heirs_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
heirs.seed.enabled=${SEED_ENABLED:false}
heirs.storage.path=${HEIRS_STORAGE_PATH:local-storage}
heirs.storage.max-file-bytes=${HEIRS_MAX_FILE_BYTES:20971520}
spring.servlet.multipart.max-file-size=${HEIRS_MAX_FILE_BYTES:20971520}B
spring.servlet.multipart.max-request-size=${HEIRS_MAX_REQUEST_BYTES:104857600}B
heirs.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
